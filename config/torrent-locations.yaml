version: 1

torrent:
  save_locations:
    - id: movies
      label: Movies
      path: /mnt/raid1/jellyfin/media/movies

    - id: tv
      label: TV
      path: /mnt/raid1/jellyfin/media/tv

  custom_paths:
    enabled: true
    allowed_roots:
      - /mnt/raid1/jellyfin/media

  pending_request_ttl_seconds: 600

  tracking:
    enabled: true
    poll_interval_seconds: 25
    auto_track_new: true
    notify_on_complete: true
    import_incomplete_tagged_on_start: true
    completed_retention_hours: 72
