[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "padval-bot"
version = "0.1.0"
description = "A locked-down Telegram command for one-message homelab status reports"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Padval Bot contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.scripts]
padval-bot = "padval_bot.main:main"

[tool.setuptools.packages.find]
where = ["src"]
